<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apps Script connection proof</title>
  <style>
    body{font:16px system-ui,sans-serif;max-width:760px;margin:36px auto;padding:0 18px;color:#233044}
    input,button{font:inherit;padding:9px 12px;margin:4px;border:1px solid #ccd4df;border-radius:6px}
    button{cursor:pointer;background:#f4f7fb}pre{background:#f4f6f8;padding:14px;overflow:auto;min-height:120px}
  </style>
</head>
<body>
  <h1>Apps Script &rarr; private Sheet proof</h1>
  <p>This isolated page checks browser GET, POST, server errors and concurrent writes. It does not touch CRM data.</p>
  <label>Deployed Apps Script <code>/exec</code> URL <input id="url" size="46" placeholder="https://script.google.com/macros/s/.../exec"></label>
  <p><button data-test="read">GET / read</button><button data-test="write">POST / write</button><button data-test="error">Error response</button><button data-test="concurrent">Two concurrent POSTs</button></p>
  <pre id="output">Configure and deploy the isolated Apps Script proof, then enter its URL.</pre>
  <script type="module" src="./proof.js"></script>
</body>
</html>
